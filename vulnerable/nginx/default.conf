server_tokens on;

server {
    listen 80;
    server_name localhost;

    # No security headers added (intentionally vulnerable)

    # All requests proxied to Flask app (including /static/)
    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
